id: avmEventResponder
name: AVM Event Responder
description: AVM Event Responder
resource: repository
disabled: false

configuration:
  resourceManagementConfiguration:
    eventResponderTasks:
      - description: 'ITA06 - If a new issue is opened add the "Needs: Triage :mag:" label'
        if:
          - payloadType: Issues
          - isAction:
              action: Opened
        then:
          - addLabel:
              label: "Needs: Triage :mag:"

      - description: 'ITA09 - When #RR is used in an issue, add the "Needs: Author Feedback :ear:" label'
        if:
          - payloadType: Issue_Comment
          - isIssue
          - commentContains:
              pattern: "#RR"
          - not:
              hasLabel:
                label: "Needs: Author Feedback :ear:"
        then:
          - addLabel:
              label: "Needs: Author Feedback :ear:"

      - description: 'ITA10 - When #wontfix is used in an issue, mark it by using the label of "Status: Won''t Fix :broken_heart:"'
        if:
          - payloadType: Issue_Comment
          - isIssue
          - commentContains:
              pattern: "#wontfix"
          - not:
              hasLabel:
                label: "Status: Won't Fix :broken_heart:"
        then:
          - addLabel:
              label: "Status: Won't Fix :broken_heart:"
          - closeIssue

      - description: 'ITA11 - When the author replies, remove the "Needs: Author Feedback :ear:" label and label with "Needs: Attention :wave:"'
        if:
          - payloadType: Issue_Comment
          - isIssue
          - not:
              isAction:
                action: Closed
          - hasLabel:
              label: "Needs: Author Feedback :ear:"
          - isActivitySender:
              issueAuthor: true
        then:
          - removeLabel:
              label: "Needs: Author Feedback :ear:"
          - removeLabel:
              label: "Status: No Recent Activity :zzz:"
          - addLabel:
              label: "Needs: Attention :wave:"

      - description: "ITA12 - Clean email replies on every comment"
        if:
          - payloadType: Issue_Comment
        then:
          - cleanEmailReply

      - description: 'ITA20 - If the type is feature request, assign the "Type: Feature Request :heavy_plus_sign:" label on the issue'
        if:
          - payloadType: Issues
          - isAction:
              action: Opened
          - bodyContains:
              pattern: |
                ### Issue Type?

                Feature Request
          - not:
              hasLabel:
                label: "Type: Feature Request :heavy_plus_sign:"
        then:
          - addLabel:
              label: "Type: Feature Request :heavy_plus_sign:"

      - description: 'ITA21 - If the type is bug, assign the "Type: Bug :bug:" label on the issue'
        if:
          - payloadType: Issues
          - isAction:
              action: Opened
          - bodyContains:
              pattern: |
                ### Issue Type?

                Bug
          - not:
              hasLabel:
                label: "Type: Bug :bug:"
        then:
          - addLabel:
              label: "Type: Bug :bug:"

      - description: 'ITA22 - If the type is security bug, assign the "Type: Security Bug :lock:" label on the issue'
        if:
          - payloadType: Issues
          - isAction:
              action: Opened
          - bodyContains:
              pattern: |
                ### Issue Type?

                Security Bug
          - not:
              hasLabel:
                label: "Type: Security Bug :lock:"
        then:
          - addLabel:
              label: "Type: Security Bug :lock:"

      - description: 'ITA23 - Remove the "Status: In PR" label from an issue when it''s closed.'
        if:
          - payloadType: Issues
          - isAction:
              action: Closed
          - hasLabel:
              label: "Status: In PR :point_right:"
        then:
          - removeLabel:
              label: "Status: In PR :point_right:"

      - description: 'ITA24 - Remove the "Needs: Triage", "Needs: Immediate Attention", and "Status: Response Overdue" labels from an issue when it''s closed.'
        if:
          - payloadType: Issues
          - isAction:
              action: Closed
        then:
          - removeLabel:
              label: "Needs: Triage :mag:"
          - removeLabel:
              label: "Needs: Immediate Attention :bangbang:"
          - removeLabel:
              label: "Status: Response Overdue :triangular_flag_on_post:"
