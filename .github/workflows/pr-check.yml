---
name: PR Check
on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize', 'labeled', 'unlabeled']
  workflow_dispatch:
    inputs:
      authoringSource:
        description: 'Where to obtain the Avm.Authoring PowerShell module.'
        required: false
        type: choice
        options:
          - gallery
          - repo
        default: gallery
      authoringRef:
        description: 'Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag).'
        required: false
        type: string
        default: ''

jobs:
  run-managed-workflow:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'PR: Run Required E2E Tests' ||
      github.event.label.name == 'PR: Run All E2E Tests'
    uses: Azure/azure-verified-modules-tools/.github/workflows/terraform-module.yml@c62bf0153e307777c064e536125547b47f31358b
    name: run managed workflow
    with:
      authoringSource: ${{ inputs.authoringSource || 'gallery' }}
      authoringRef: ${{ inputs.authoringRef || '' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write
